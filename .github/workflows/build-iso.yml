name: Build RalyxOS ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso grub-pc-bin grub-efi-amd64-bin squashfs-tools
      - name: Build customized RalyxOS image
        run: |
          sudo lb clean --purge || true
          sudo sh auto/config
          sudo lb build
      - name: Package and checksum ISO
        run: |
          iso=$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$iso"
          cp "$iso" ralyxos-amd64.iso
          sha256sum ralyxos-amd64.iso > ralyxos-amd64.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ralyxos-amd64
          path: |
            ralyxos-amd64.iso
            ralyxos-amd64.iso.sha256
          compression-level: 0
