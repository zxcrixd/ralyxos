name: Build ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to publish (for example v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Download Debian Bookworm installer ISO
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            https://cdimage.debian.org/cdimage/archive/12.11.0/amd64/iso-cd/debian-12.11.0-amd64-netinst.iso \
            -o ralyxos-amd64.iso
          sha256sum ralyxos-amd64.iso > ralyxos-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ralyxos-amd64-iso
          path: |
            ralyxos-amd64.iso
            ralyxos-amd64.iso.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish release assets
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$TAG" ralyxos-amd64.iso ralyxos-amd64.iso.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "RalyxOS $TAG" \
            --notes "Debian Bookworm amd64 netinst installer ISO. Choose XFCE during installation."
