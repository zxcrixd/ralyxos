set default=0
set timeout=8

insmod all_video
insmod gfxterm
set gfxmode=auto
terminal_output gfxterm
set color_normal=light-gray/black
set color_highlight=black/cyan

# Debian Installer paths. These are deliberately not /live/vmlinuz.
menuentry 'Install RalyxOS' {
    linux /install.amd/vmlinuz --- quiet
    initrd /install.amd/initrd.gz
}

menuentry 'Install RalyxOS (safe graphics)' {
    linux /install.amd/vmlinuz --- nomodeset
    initrd /install.amd/initrd.gz
}

menuentry 'Install RalyxOS in expert mode' {
    linux /install.amd/vmlinuz priority=low ---
    initrd /install.amd/initrd.gz
}

menuentry 'Reboot' { reboot }
menuentry 'Power off' { halt }
