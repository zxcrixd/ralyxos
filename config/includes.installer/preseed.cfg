# RalyxOS Debian Installer defaults. The installer still asks about disk,
# user, password, timezone and network; these values only select the desktop
# and packages for the installed target.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/suite string bookworm
d-i mirror/udeb/suite string bookworm
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i tasksel/first multiselect standard, xfce-desktop
d-i pkgsel/include string network-manager network-manager-gnome xfce4-goodies thunar xfce4-terminal orage galculator ffmpeg flatpak libreoffice libreoffice-gtk3 libreoffice-l10n-ru pavucontrol pipewire-audio firmware-linux firmware-linux-nonfree curl jq ca-certificates python3 python3-gi python3-requests
